# Include inside the existing HTTPS server for o2inv.ru.
location = /sphere/ui {
    return 308 /sphere/ui/;
}

location ^~ /sphere/ui/ {
    root /var/www/sphere-ui/current;
    index index.html;
    try_files $uri $uri/ =404;
    types {
        text/html html;
        text/css css;
        text/javascript js mjs;
        application/json json;
        text/plain md;
    }
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http://127.0.0.1:* http://localhost:*; connect-src 'self' http://127.0.0.1:* http://localhost:*; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    limit_except GET { deny all; }
}
